    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        mathBlue: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#1e3a8a',
                        },
                        mathDark: {
                            800: '#0f172a',
                            900: '#020617',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-nav {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
        }
        .dark .glass-nav {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .dark ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #3b82f6;
            border-radius: 4px;
        }

        /* Hiệu ứng click chuột nốt nhạc */
        .click-note-effect {
            position: fixed;
            width: 42px;
            height: 42px;
            object-fit: contain;
            pointer-events: none;
            user-select: none;
            z-index: 9999;
            border-radius: 10px;
            filter: drop-shadow(0 6px 12px rgba(37, 99, 235, 0.35));
            transform: translate(-50%, -50%) scale(0.4);
            animation: noteClickFloat 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes noteClickFloat {
            0% {
                opacity: 0.95;
                transform: translate(-50%, -50%) scale(0.45) rotate(0deg);
            }
            40% {
                opacity: 1;
                transform: translate(calc(-50% + var(--drift-x, 0px) * 0.5), calc(-50% - 28px)) scale(1.08) rotate(var(--rot-mid, 12deg));
            }
            100% {
                opacity: 0;
                transform: translate(calc(-50% + var(--drift-x, 0px)), calc(-50% - 72px)) scale(0.75) rotate(var(--rot-end, 24deg));
            }
        }
    </style>
</head>
